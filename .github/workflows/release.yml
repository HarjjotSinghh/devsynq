name: Release

on:
  push:
    tags:
      - 'v*'
    # branches:
      # - 'prod'
  # Allow manual trigger for testing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Bun
        if: ${{ github.actor != 'nektos/act' }}
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Bun (act fallback)
        if: ${{ github.actor == 'nektos/act' }}
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install

      - name: Build Frontend & Main
        run: bun run build

      - name: Build Electron App (Windows)
        run: bun run dist --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows Code Signing (optional - remove if not using)
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: List release directory contents
        run: dir release
        shell: cmd
        continue-on-error: true

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: warn
          retention-days: 5

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Build Frontend & Main
        run: bun run build
      - name: Build Electron App (macOS)
        run: bun run dist --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: warn
          retention-days: 5

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Build Frontend & Main
        run: bun run build
      - name: Build Electron App (Linux)
        run: bun run dist --linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            release/*.AppImage
          if-no-files-found: warn
          retention-days: 5

  publish-release:
    if: ${{ startsWith(github.ref, 'refs/tags/') && github.actor != 'nektos/act' }}
    needs: [build-windows]  # Add build-macos, build-linux when enabled
    runs-on: ubuntu-latest
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display downloaded files
        run: |
          echo "=== All downloaded artifacts ==="
          find artifacts -type f
          echo "=== File details ==="
          find artifacts -type f -exec ls -lh {} \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
          body: |
            ## Downloads
            
            | Platform | Download |
            |----------|----------|
            | Windows (Installer) | `.exe` file below |
            | Windows (Portable) | `.zip` file below |
            
            ### Installation Instructions
            
            **Windows:** Download the `.exe` installer and run it. Windows may show a SmartScreen warning - click "More info" → "Run anyway".
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
