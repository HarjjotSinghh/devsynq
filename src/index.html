<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;">
  <title>DevSynq - AI IDE Launcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    /* ========================================
       CSS Variables & Design Tokens
    ======================================== */
    :root {
      /* Colors */
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-tertiary: #1a1a25;
      --bg-card: rgba(26, 26, 37, 0.8);
      --bg-card-hover: rgba(35, 35, 50, 0.9);

      --text-primary: #ffffff;
      --text-secondary: #a0a0b0;
      --text-muted: #6b6b7b;

      --accent-primary: #7c3aed;
      --accent-secondary: #06b6d4;
      --accent-gradient: linear-gradient(135deg, #7c3aed 0%, #06b6d4 100%);

      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;

      --border-color: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.15);

      /* Shadows */
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.03);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.04);
      --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.05);
      --shadow-glow: 0 0 40px rgba(124, 58, 237, 0.03);

      /* Spacing */
      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;
      --spacing-2xl: 48px;

      /* Border Radius */
      --radius-sm: 2px;
      --radius-md: 4px;
      --radius-lg: 8px;
      --radius-xl: 12px;
      --radius-full: 9999px;

      /* Transitions */
      --transition-fast: 150ms ease;
      --transition-normal: 250ms ease;
      --transition-slow: 400ms ease;
    }

    [data-theme="light"] {
      --bg-primary: #f7f7fb;
      --bg-secondary: #ffffff;
      --bg-tertiary: #eef0f6;
      --bg-card: rgba(255, 255, 255, 0.95);
      --bg-card-hover: #eef0f6;

      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #6b7280;

      --border-color: rgba(15, 23, 42, 0.08);
      --border-hover: rgba(15, 23, 42, 0.15);

      --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 16px 48px rgba(15, 23, 42, 0.12);
    }

    /* ========================================
       Base & Reset
    ======================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Manrope', system-ui, -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ========================================
       App Container
    ======================================== */
    .app-container {
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      background: var(--bg-primary);
      position: relative;
      overflow: hidden;
    }

    /* Background Effects */
    .app-container::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(124, 58, 237, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(6, 182, 212, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(245, 158, 11, 0.05) 0%, transparent 50%);
      pointer-events: none;
      animation: bgPulse 20s ease-in-out infinite;
    }

    @keyframes bgPulse {

      0%,
      100% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }

      50% {
        transform: translate(-5%, -5%) scale(1.1);
        opacity: 0.8;
      }
    }

    /* ========================================
       Title Bar (Custom Frameless)
    ======================================== */
    .title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--spacing-sm) var(--spacing-md);
      background: rgba(10, 10, 15, 0.9);
      border-bottom: 1px solid var(--border-color);
      -webkit-app-region: drag;
      position: relative;
      z-index: 100;
    }

    .title-bar-title {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .title-bar-logo {
      width: 20px;
      height: 20px;
      background: var(--accent-gradient);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .window-controls {
      display: flex;
      gap: var(--spacing-xs);
      -webkit-app-region: no-drag;
    }

    .window-control-btn {
      width: 36px;
      height: 28px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      transition: var(--transition-fast);
      font-size: 16px;
    }

    .window-control-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
    }

    .window-control-btn.close:hover {
      background: var(--error);
      color: white;
    }

    /* ========================================
       Main Content
    ======================================== */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: var(--spacing-2xl);
      position: relative;
      z-index: 10;
    }

    /* Custom Scrollbar */
    .main-content::-webkit-scrollbar {
      width: 8px;
    }

    .main-content::-webkit-scrollbar-track {
      background: transparent;
    }

    .main-content::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: var(--radius-full);
    }

    .main-content::-webkit-scrollbar-thumb:hover {
      background: var(--border-hover);
    }

    /* ========================================
       Header Section
    ======================================== */
    .header {
      margin-bottom: var(--spacing-2xl);
      text-align: center;
    }

    .header-title {
      font-size: 42px;
      font-weight: 700;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: var(--spacing-sm);
      letter-spacing: -1px;
    }

    .header-subtitle {
      font-size: 16px;
      color: var(--text-secondary);
      margin-bottom: var(--spacing-lg);
    }

    /* Stats Bar */
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: var(--spacing-xl);
      margin-top: var(--spacing-lg);
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      padding: var(--spacing-sm) var(--spacing-md);
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-full);
      backdrop-filter: blur(10px);
    }

    .stat-value {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .stat-label {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Refresh Button */
    #refresh-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: var(--spacing-sm) var(--spacing-md);
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: var(--transition-normal);
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: var(--spacing-xs);
    }

    #refresh-btn:hover {
      background: var(--bg-card-hover);
      color: var(--text-primary);
      border-color: var(--border-hover);
    }

    /* ========================================
       IDE Grid
    ======================================== */
    #ide-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: var(--spacing-lg);
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Loading State */
    .loading-state,
    .error-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: var(--spacing-2xl);
      color: var(--text-secondary);
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border-color);
      border-top-color: var(--accent-primary);
      border-radius: 50%;
      margin: 0 auto var(--spacing-md);
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ========================================
       IDE Card
    ======================================== */
    .ide-card {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: var(--spacing-xl);
      cursor: pointer;
      transition: var(--transition-normal);
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    .ide-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-color, var(--accent-primary));
      box-shadow:
        var(--shadow-lg),
        0 0 30px color-mix(in srgb, var(--accent-color, var(--accent-primary)) 30%, transparent);
    }

    .ide-card.installed:hover {
      background: var(--bg-card-hover);
    }

    .ide-card.not-installed {
      opacity: 0.7;
    }

    .ide-card.not-installed:hover {
      opacity: 1;
    }

    /* Card Glow Effect */
    .card-glow {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 100%;
      background: linear-gradient(180deg,
          color-mix(in srgb, var(--accent-color, var(--accent-primary)) 10%, transparent) 0%,
          transparent 50%);
      opacity: 0;
      transition: var(--transition-normal);
      pointer-events: none;
    }

    .ide-card:hover .card-glow {
      opacity: 1;
    }

    .card-content {
      position: relative;
      z-index: 1;
    }

    .ide-icon {
      font-size: 48px;
      margin-bottom: var(--spacing-md);
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.03));
    }

    .ide-name {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: var(--spacing-sm);
    }

    /* Status Indicator */
    .ide-status {
      display: flex;
      align-items: center;
      gap: var(--spacing-xs);
      margin-bottom: var(--spacing-lg);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .status-dot.active {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
      animation: pulse 2s ease-in-out infinite;
    }

    .status-dot.inactive {
      background: var(--warning);
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.5;
      }
    }

    .status-text {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Action Button */
    .ide-action-btn {
      width: 100%;
      padding: var(--spacing-sm) var(--spacing-md);
      border: none;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-xs);
    }

    .launch-btn {
      background: var(--accent-gradient);
      color: white;
    }

    .launch-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 4px 16px rgba(124, 58, 237, 0.04);
    }

    .launch-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .install-btn {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
    }

    .install-btn:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      border-color: var(--border-hover);
    }

    /* ========================================
       Toast Notifications
    ======================================== */
    .toast {
      position: fixed;
      bottom: -60px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: var(--spacing-md) var(--spacing-lg);
      border-radius: var(--radius-lg);
      font-size: 14px;
      box-shadow: var(--shadow-lg);
      transition: var(--transition-normal);
      z-index: 1000;
      backdrop-filter: blur(10px);
    }

    .toast.show {
      bottom: var(--spacing-xl);
    }

    /* ========================================
       Footer
    ======================================== */
    .footer {
      padding: var(--spacing-md) var(--spacing-xl);
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      border-top: 1px solid var(--border-color);
      background: rgba(10, 10, 15, 0.5);
      position: relative;
      z-index: 10;
    }

    .footer a {
      color: var(--accent-primary);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    /* ========================================
       Projects Section
    ======================================== */
    .projects-section {
      width: 100%;
      max-width: 1400px;
      margin: var(--spacing-2xl) auto 0;
      padding-top: var(--spacing-xl);
      border-top: 1px solid var(--border-color);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--spacing-lg);
    }

    .project-toolbar {
      display: flex;
      gap: var(--spacing-md);
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: var(--spacing-md);
    }

    .search-input {
      flex: 1;
      min-width: 260px;
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 0 var(--spacing-sm);
    }

    .search-input input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-primary);
      padding: var(--spacing-sm) var(--spacing-xs);
      outline: none;
      font-size: 14px;
    }

    .shortcut-hint {
      font-size: 12px;
      color: var(--text-muted);
      background: var(--bg-tertiary);
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
    }

    .section-title {
      font-size: 24px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .section-subtitle {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: var(--spacing-sm);
    }

    .add-project-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: var(--spacing-sm) var(--spacing-md);
      border-radius: var(--radius-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      transition: var(--transition-fast);
      font-size: 14px;
    }

    .add-project-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent-primary);
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: var(--spacing-md);
    }

    .recent-grid {
      margin-top: var(--spacing-sm);
    }

    .project-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: var(--spacing-md);
      cursor: pointer;
      transition: var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .project-card.compact {
      padding: var(--spacing-sm) var(--spacing-md);
    }

    .project-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    .project-info {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      overflow: hidden;
    }

    .project-icon {
      width: 40px;
      height: 40px;
      background: var(--bg-tertiary);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .project-details {
      overflow: hidden;
    }

    .project-name {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .project-path {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .project-meta {
      font-size: 11px;
      color: var(--text-muted);
    }

    .project-actions {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      opacity: 0;
      transition: var(--transition-fast);
    }

    .project-card:hover .project-actions {
      opacity: 1;
    }

    .project-action-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
    }

    .project-action-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
    }

    .project-action-btn.delete:hover {
      background: rgba(239, 68, 68, 0.2);
      color: var(--error);
    }

    /* ========================================
       Modal
    ======================================== */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 500px;
      box-shadow: var(--shadow-lg);
      animation: modalSlideIn 0.3s ease;
    }

    @keyframes modalSlideIn {
      from {
        transform: translateY(20px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .modal-header {
      padding: var(--spacing-lg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-header h2 {
      font-size: 20px;
      font-weight: 600;
    }

    .close-modal {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 20px;
    }

    .modal-body {
      padding: var(--spacing-lg);
    }

    .setting-item {
      margin-bottom: var(--spacing-lg);
    }

    .setting-item label {
      display: block;
      margin-bottom: var(--spacing-sm);
      color: var(--text-secondary);
      font-size: 14px;
    }

    .setting-item select {
      width: 100%;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: var(--spacing-sm);
      border-radius: var(--radius-sm);
      outline: none;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      cursor: pointer;
    }

    .checkbox-label input {
      width: 16px;
      height: 16px;
    }

    .modal-footer {
      padding: var(--spacing-lg);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: flex-end;
    }

    .primary-btn {
      background: var(--accent-gradient);
      color: white;
      border: none;
      padding: var(--spacing-sm) var(--spacing-lg);
      border-radius: var(--radius-md);
      cursor: pointer;
      font-weight: 500;
    }

    .primary-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body data-theme="dark">
  <div class="app-container">
    <!-- Custom Title Bar -->
    <div class="title-bar">
      <div class="title-bar-title">
        <div class="title-bar-logo">⚡</div>
        <span>DevSynq</span>
      </div>
      <div class="window-controls">

        <button id="settings-btn" class="window-control-btn" title="Settings">⚙️</button>
        <button id="minimize-btn" class="window-control-btn" title="Minimize">─</button>
        <button id="maximize-btn" class="window-control-btn" title="Maximize">□</button>
        <button id="close-btn" class="window-control-btn close" title="Close">✕</button>

      </div>
    </div>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Header -->
      <header class="header">
        <h1 class="header-title">AI IDE Launcher</h1>
        <p class="header-subtitle">Launch your favorite AI-powered development environments instantly</p>

        <div class="stats-bar">
          <div class="stat-item">
            <span class="stat-value" id="installed-count">-</span>
            <span class="stat-label">Installed</span>
          </div>
          <div class="stat-item">
            <span class="stat-value" id="total-count">-</span>
            <span class="stat-label">Total IDEs</span>
          </div>
          <button id="refresh-btn" title="Refresh IDE list">
            🔄 Refresh
          </button>
        </div>
      </header>

      <!-- IDE Grid -->
      <div id="ide-grid">
        <!-- IDE cards will be dynamically inserted here -->
      </div>

      <!-- Projects Section -->
      <section class="projects-section">
        <div class="section-header">
          <h2 class="section-title">Projects</h2>
          <button id="add-project-btn" class="add-project-btn">
            <span>+</span> Add Project
          </button>
        </div>
        <div class="project-toolbar">
          <div class="search-input">
            <span aria-hidden="true">🔍</span>
            <input id="project-search" type="text" placeholder="Search projects by name or path (Cmd/Ctrl + P)" />
            <span class="shortcut-hint">⌘/Ctrl + P</span>
          </div>
        </div>
        <div>
          <h3 class="section-subtitle">Recent</h3>
          <div id="recent-projects" class="projects-grid recent-grid"></div>
        </div>
        <div style="margin-top: var(--spacing-md);">
          <h3 class="section-subtitle">All Projects</h3>
          <div id="projects-grid" class="projects-grid">
            <!-- Project cards will be dynamically inserted here -->
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>DevSynq v1.1.2 · Built with 🍵 by <a href="https://github.com/harjjotsinghh" target="_blank"
          rel="noopener noreferrer">Harjot Rana</a></p>
    </footer>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Settings</h2>
          <button class="close-modal">✕</button>
        </div>
        <div class="modal-body">
          <div class="setting-item">
            <label>Default IDE</label>
            <select id="default-ide-select">
              <option value="Cursor">Cursor</option>
              <option value="VS Code">VS Code</option>
              <option value="Windsurf">Windsurf</option>
              <option value="Zed">Zed</option>
              <option value="WebStorm">WebStorm</option>
              <option value="Trae">Trae</option>
              <option value="Replit">Replit</option>
              <option value="Cody">Cody</option>
              <option value="Continue">Continue</option>
              <option value="IntelliJ IDEA">IntelliJ IDEA</option>
              <option value="PyCharm">PyCharm</option>
            </select>
          </div>
          <div class="setting-item">
            <label class="checkbox-label">
              <input type="checkbox" id="launch-startup-check">
              Launch at Startup
            </label>
          </div>
          <div class="setting-item">
            <label class="checkbox-label">
              <input type="checkbox" id="auto-detect-check">
              Auto-detect new IDEs on launch
            </label>
          </div>
          <div class="setting-item">
            <label class="checkbox-label">
              <input type="checkbox" id="theme-toggle">
              Light theme
            </label>
          </div>
        </div>
        <div class="modal-footer">
          <button id="save-settings-btn" class="primary-btn">Save Changes</button>
        </div>
      </div>
    </div>

  </div>

  <script src="renderer.js"></script>
</body>

</html>
